[package]
name = "hate"
version = "0.1.0"
edition = "2024"

[features]
client = ["dep:client"]
server = ["dep:server"]

[dependencies]
bevy.workspace = true
duck_back.workspace = true
client = { workspace = true, optional = true }
server = { workspace = true, optional = true }

[workspace]
resolver = "3"
members = ["client", "server", "shared"]

[workspace.dependencies]
# this could be cut down depending on the features used
bevy = { version = "0.18", default-features = false, features = ["dynamic_linking", "serialize", "debug"] }
# bevy additions
bevy_console.git = "https://github.com/DudeGunter/bevy_console.git"
bevy-inspector-egui = "0.36"
bevy_transform_interpolation = "0.4"
# networking
serde = "1.0"
aeronet = "0.19"
aeronet_webtransport = { version = "0.19", features = ["dangerous-configuration"] }
aeronet_replicon = "0.19"
bevy_replicon = "0.38"
# physics
avian3d = { version = "0.6", features = ["serialize"] }
# server tui
ratatui = "0.30.0"
crossterm = "0.29.0"
crossbeam = "0.8"
chrono = "0.4"
# error handling
duck_back = "1.0"
# crates within the project
server.path = "server"
client.path = "client"
shared.path = "shared"

# Set max log levels. This helps avoid unwanted low-severity log spam, which can affect performance.
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
tracing = { version = "0.1", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
# In some cases they may still signal poor code quality however, so consider commenting out these lines.
[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.config_fast_builds
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
